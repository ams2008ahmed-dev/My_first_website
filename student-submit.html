<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقديم بلاغ أو فكرة - نظام الإبلاغ المدرسي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>تقديم بلاغ أو فكرة</h1>
      <a href="index.html" class="back-link">← العودة للقائمة الرئيسية</a>
    </div>

    <div class="form-container">
      <form id="reportForm">
        <div class="form-group">
          <label>نوع التقرير *</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="type" value="problem" checked>
              <span>مشكلة</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="type" value="idea">
              <span>فكرة</span>
            </label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="student_name">اسم الطالب *</label>
            <input type="text" id="student_name" name="student_name" required>
          </div>

          <div class="form-group">
            <label for="grade">الصف الدراسي *</label>
            <input type="text" id="grade" name="grade" placeholder="مثال: الثالث الثانوي" required>
          </div>

          <div class="form-group">
            <label for="section">الشعبة *</label>
            <input type="text" id="section" name="section" placeholder="مثال: أ" required>
          </div>
        </div>

        <div class="form-group">
          <label for="description">وصف المشكلة أو الفكرة *</label>
          <textarea id="description" name="description" rows="5" required></textarea>
        </div>

        <div class="form-group">
          <label for="solution_idea">اقتراح لحل المشكلة (اختياري)</label>
          <textarea id="solution_idea" name="solution_idea" rows="3"></textarea>
        </div>

        <button type="submit" class="btn-primary">إرسال البلاغ</button>
        <p id="status" style="margin-top:10px;"></p>
      </form>
    </div>
  </div>

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://lmoalkwfmemgtlyezpdo.supabase.co";
    const supabaseKey = "sb_publishable_ZpstGvn0ekVJlEzDXqlR7A_uzg16IUn";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("reportForm");
    const statusText = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const type = form.querySelector('input[name="type"]:checked').value;
      const student_name = document.getElementById("student_name").value;
      const grade = document.getElementById("grade").value;
      const section = document.getElementById("section").value;
      const description = document.getElementById("description").value;
      const solution_idea = document.getElementById("solution_idea").value;

      // إدراج البلاغ في جدول "reports"
      const { error } = await supabase.from("reports").insert([{
        type,
        student_name,
        grade,
        section,
        description,
        solution_idea,
        status: "open",
        created_at: new Date().toISOString()
      }]);

      if (error) {
        statusText.textContent = "حدث خطأ أثناء الإرسال ❌";
        statusText.style.color = "red";
      } else {
        statusText.textContent = "تم إرسال البلاغ بنجاح ✅";
        statusText.style.color = "green";
        form.reset();
      }
    });
  </script>
</body>
</html>
