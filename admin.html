<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - نظام الإبلاغ المدرسي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>لوحة الإدارة</h1>
      <a href="index.html" class="back-link">← العودة للقائمة الرئيسية</a>
    </div>

    <div class="reports-grid" id="adminReportsContainer">
      <div class="loading">جاري التحميل...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://lmoalkwfmemgtlyezpdo.supabase.co";
    const supabaseKey = "sb_publishable_ZpstGvn0ekVJlEzDXqlR7A_uzg16IUn";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function loadAdminReports() {
      const { data: reports, error } = await supabase.from('reports').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('adminReportsContainer');

      if (error || !reports) {
        container.innerHTML = '<div class="empty-state">حدث خطأ أثناء جلب البلاغات ❌</div>';
        console.error(error);
        return;
      }

      if (reports.length === 0) {
        container.innerHTML = '<div class="empty-state">لا توجد بلاغات حالياً</div>';
        return;
      }

      container.innerHTML = reports.map(r => `
        <div class="report-card ${r.type}">
          <div class="report-header">
            <span class="report-type">${r.type === 'problem' ? '🔧 مشكلة' : '💡 فكرة'}</span>
            <select class="status-select" data-id="${r.id}">
              <option value="open" ${r.status === 'open' ? 'selected' : ''}>مفتوح</option>
              <option value="resolved" ${r.status === 'resolved' ? 'selected' : ''}>تم الحل</option>
            </select>
          </div>
          <div class="report-info">
            <p><strong>الطالب:</strong> ${r.student_name}</p>
            <p><strong>الصف:</strong> ${r.grade} - ${r.section}</p>
          </div>
          <div class="report-description"><p>${r.description}</p></div>
          ${r.solution_idea ? `<div class="solution-idea"><strong>اقتراح الحل:</strong><p>${r.solution_idea}</p></div>` : ''}
          ${r.image_url ? `<div class="report-image"><img src="${r.image_url}" alt="صورة البلاغ"></div>` : ''}
          <div class="report-footer"><small>${new Date(r.created_at).toLocaleString('ar-SA')}</small></div>
        </div>
      `).join('');

      document.querySelectorAll('.status-select').forEach(select => {
        select.addEventListener('change', async function() {
          const id = this.dataset.id;
          const status = this.value;
          const { error } = await supabase.from('reports').update({ status }).eq('id', id);
          if (error) {
            alert('حدث خطأ أثناء تحديث الحالة ❌');
            console.error(error);
          } else {
            loadAdminReports();
          }
        });
      });
    }

    loadAdminReports();
    setInterval(loadAdminReports, 5000);
  </script>
</body>
</html>
