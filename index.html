<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الإبلاغ المدرسي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>نظام الإبلاغ المدرسي</h1>
      <p class="subtitle">مرحباً بك في نظام الإبلاغ عن المشاكل والأفكار</p>
    </div>

    <div class="menu-grid">
      <a href="student-submit.html" class="menu-card">
        <div class="icon">📝</div>
        <h2>تقديم بلاغ أو فكرة</h2>
        <p>قم بالإبلاغ عن مشكلة أو اقترح فكرة جديدة</p>
      </a>

      <a href="student-view.html" class="menu-card">
        <div class="icon">👀</div>
        <h2>عرض البلاغات والأفكار</h2>
        <p>اطلع على بلاغات وأفكار زملائك</p>
      </a>

      <a href="admin.html" class="menu-card admin-card">
        <div class="icon">🔐</div>
        <h2>لوحة الإدارة</h2>
        <p>إدارة البلاغات والأفكار</p>
      </a>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // إعداد اتصال Supabase
  const supabaseUrl = "https://lmoalkwfmemgtlyezpdo.supabase.co";
  const supabaseKey = "sb_publishable_ZpstGvn0ekVJlEzDXqlR7A_uzg16IUn";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  // التعامل مع إرسال النموذج
  document.getElementById("msg-form").addEventListener("submit", async (e) => {
    e.preventDefault(); // منع إعادة تحميل الصفحة

    const name = document.getElementById("name").value;
    const message = document.getElementById("message").value;

    // إرسال البيانات إلى جدول messages
    const { error } = await supabase
      .from("messages")
      .insert([{ name, message }]);

    // عرض حالة الإرسال للمستخدم
    document.getElementById("status").innerText =
      error ? "حدث خطأ ❌" : "تم الإرسال بنجاح ✅";

    // مسح النموذج بعد الإرسال الناجح
    if (!error) {
      document.getElementById("msg-form").reset();
    }
  });
</script>
</body>
</html>
