<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الإبلاغ المدرسي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>نظام الإبلاغ المدرسي</h1>
      <p class="subtitle">مرحباً بك في نظام الإبلاغ عن المشاكل والأفكار</p>
    </div>

    <div class="menu-grid">
      <a href="student-submit.html" class="menu-card">
        <div class="icon">📝</div>
        <h2>تقديم بلاغ أو فكرة</h2>
        <p>قم بالإبلاغ عن مشكلة أو اقترح فكرة جديدة</p>
      </a>

      <a href="student-view.html" class="menu-card">
        <div class="icon">👀</div>
        <h2>عرض البلاغات والأفكار</h2>
        <p>اطلع على بلاغات وأفكار زملائك</p>
      </a>

      <a href="admin.html" class="menu-card admin-card">
        <div class="icon">🔐</div>
        <h2>لوحة الإدارة</h2>
        <p>إدارة البلاغات والأفكار</p>
      </a>
    </div>
  </div>

  <!-- نموذج الإرسال -->
  <section id="contact-section">
    <h2>إرسال رسالة</h2>
    <form id="msg-form">
      <input type="text" id="name" placeholder="اسمك" required>
      <textarea id="message" placeholder="رسالتك" required></textarea>
      <button type="submit">إرسال</button>
    </form>
    <p id="status"></p>
  </section>

  <!-- عرض الرسائل -->
  <section id="messages-section">
    <h2>الرسائل السابقة</h2>
    <div id="messages-list">
      <p>جارٍ تحميل الرسائل...</p>
    </div>
  </section>

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- كود Supabase (مرة واحدة فقط) -->
  <script>
    const supabaseUrl = "https://lmoalkwfmemgtlyezpdo.supabase.co";
    const supabaseKey = "sb_publishable_ZpstGvn0ekVJlEzDXqlR7A_uzg16IUn";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function loadMessages() {
      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .order("created_at", { ascending: false });

      const list = document.getElementById("messages-list");
      list.innerHTML = "";

      if (error || !data || data.length === 0) {
        list.innerHTML = "<p>لا توجد رسائل.</p>";
        return;
      }

      data.forEach(msg => {
        const div = document.createElement("div");
        div.innerHTML = `<strong>${msg.name}</strong><br>${msg.message}<hr>`;
        list.appendChild(div);
      });
    }

    document.getElementById("msg-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;

      const { error } = await supabase
        .from("messages")
        .insert([{ name, message }]);

      document.getElementById("status").innerText =
        error ? "حدث خطأ ❌" : "تم الإرسال بنجاح ✅";

      if (!error) {
        e.target.reset();
        loadMessages();
      }
    });

    loadMessages();
  </script>

</body>
</html>
