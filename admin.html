<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - نظام الإبلاغ المدرسي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>لوحة الإدارة</h1>
      <a href="index.html" class="back-link">← العودة للقائمة الرئيسية</a>
    </div>

    <div class="admin-controls">
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">الكل</button>
        <button class="tab-btn" data-filter="problem">المشاكل</button>
        <button class="tab-btn" data-filter="idea">الأفكار</button>
      </div>

      <div id="reportsContainer" class="reports-grid">
        <div class="loading">جارٍ التحميل...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://lmoalkwfmemgtlyezpdo.supabase.co";
    const supabaseKey = "sb_publishable_ZpstGvn0ekVJlEzDXqlR7A_uzg16IUn";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentFilter = 'all';

    async function loadReports() {
      const { data: reports, error } = await supabase.from('reports').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('reportsContainer');

      if (error || !reports) {
        container.innerHTML = '<div class="empty-state">حدث خطأ أثناء جلب البلاغات ❌</div>';
        return;
      }

      const filteredReports = currentFilter === 'all'
        ? reports
        : reports.filter(r => r.type === currentFilter);

      if (filteredReports.length === 0) {
        container.innerHTML = '<div class="empty-state">لا توجد بلاغات حالياً</div>';
        return;
      }

      container.innerHTML = filteredReports.map(r => `
        <div class="report-card ${r.type}">
          <div class="report-header">
            <span class="report-type">${r.type === 'problem' ? '🔧 مشكلة' : '💡 فكرة'}</span>
            ${r.status === 'resolved' ? '<span class="resolved-badge">✓ تم الحل</span>' : ''}
          </div>
          <div class="report-info">
            <p><strong>الطالب:</strong> ${r.student_name}</p>
            <p><strong>الصف:</strong> ${r.grade} - ${r.section}</p>
          </div>
          <div class="report-description"><p>${r.description}</p></div>
          ${r.solution_idea ? `<div class="solution-idea"><strong>اقتراح الحل:</strong><p>${r.solution_idea}</p></div>` : ''}
          ${r.image_url ? `<div class="report-image"><img src="${r.image_url}" alt="صورة البلاغ"></div>` : ''}
          <div class="report-footer">
            <button class="btn-primary mark-resolved" data-id="${r.id}">وضع كـ تم الحل</button>
            <button class="btn-danger delete-report" data-id="${r.id}">حذف البلاغ</button>
            <small>${new Date(r.created_at).toLocaleString('ar-SA')}</small>
          </div>
        </div>
      `).join('');

      // أزرار الحل والحذف
      document.querySelectorAll('.mark-resolved').forEach(btn => {
        btn.addEventListener('click', async () => {
          await supabase.from('reports').update({ status: 'resolved' }).eq('id', btn.dataset.id);
          loadReports();
        });
      });

      document.querySelectorAll('.delete-report').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (confirm('هل أنت متأكد من حذف البلاغ؟')) {
            await supabase.from('reports').delete().eq('id', btn.dataset.id);
            loadReports();
          }
        });
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.getAttribute('data-filter');
        loadReports();
      });
    });

    loadReports();
    setInterval(loadReports, 5000);
  </script>
</body>
</html>
